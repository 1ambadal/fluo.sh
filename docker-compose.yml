services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # SQLite DB — persists across restarts
      - ./models:/app/models      # Kokoro + Silero ONNX files
      - hf_cache:/app/.cache/huggingface  # Whisper cache — survives rebuilds
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  hf_cache:   # Named volume — Docker manages it, persists until 'docker volume rm'
